# ====================== 生产环境日志配置（直接复制） ======================
logging:
  # 日志输出文件路径（自动按天切割）
  file:
    name: ./logs/smartpai.log
  logback:
    rollingpolicy:
      # 日志归档规则：每天生成一个新文件
      file-name-pattern: ./logs/smartpai-%d{yyyy-MM-dd}.log
      # 最多保留 30 天日志
      max-history: 30
      # 总日志大小上限 5GB
      total-size-cap: 3GB
      # 单个日志文件最大 100MB
      max-file-size: 100MB
  # 生产环境日志级别（关闭多余 DEBUG，只留重要信息）
  level:
    root: INFO                     # 全局默认 INFO
    org.springframework: WARN      # 框架警告级别
    org.springframework.security: WARN
    com.yizhaoqi.smartpai: INFO    # 你的项目代码 INFO
    io.minio: WARN                 # MinIO 关闭调试
    org.hibernate: WARN            # 数据库关闭 SQL 打印
    org.apache.tika: WARN

# 关闭多余 log4j 调试（避免日志泛滥）
log4j:
  logger:
    org:
      apache:
        tika: WARN

